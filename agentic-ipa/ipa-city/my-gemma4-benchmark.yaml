api:
  type: completion
  streaming: true
data:
  type: random
  input_distribution:
    min: 128
    max: 512
    mean: 320.0
    type: uniform
  output_distribution:
    min: 16
    max: 128
    mean: 72.0
    type: uniform
load:
  type: constant
  stages:
  - rate: 5.0
    duration: 30
server:
  type: vllm
  model_name: google/gemma-2b
  base_url: http://localhost:18010/api/v1/namespaces/default/services/gemma4-vllm-vllm-service:8000/proxy
storage:
  local_storage:
    path: my-gemma4-report
