apiVersion: v1
kind: Service
metadata:
  labels:
    app: llama-3-1-70b-vllm-inference-server
  name: llama-3-1-70b-vllm-service
spec:
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: llama-3-1-70b-vllm-inference-server
    deployment: llama-3-1-70b-vllm-deployment
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llama-3-1-70b-vllm-inference-server
  name: llama-3-1-70b-vllm-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-3-1-70b-vllm-inference-server
      deployment: llama-3-1-70b-vllm-deployment
  template:
    metadata:
      labels:
        ai.gke.io/inference-server: vllm
        ai.gke.io/model: LLaMA3_1_70B
        app: llama-3-1-70b-vllm-inference-server
        deployment: llama-3-1-70b-vllm-deployment
        examples.ai.gke.io/source: blueprints
    spec:
      containers:
      - args:
        - --model=$(MODEL_ID)
        - --tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        env:
        - name: MODEL_ID
          value: meta-llama/Meta-Llama-3.1-70B-Instruct
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: hf_api_token
              name: hf-secret
        - name: TENSOR_PARALLEL_SIZE
          value: "8"
        image: vllm/vllm-openai:latest
        name: inference-server
        ports:
        - containerPort: 8000
          name: metrics
        readinessProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: 8
          requests:
            ephemeral-storage: 150Gi
            nvidia.com/gpu: 8
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
      volumes:
      - emptyDir:
          medium: Memory
        name: dshm
