# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: v5e-2x4.yaml
    target:
      kind: Deployment
  - path: v5e-2x4.yaml
    target:
      kind: Job
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "*"
      spec:
        template:
          spec:
            containers:
            - name: inference-server
              env:
              - name: TENSOR_PARALLEL_SIZE
                value: "8"
    target:
      kind: Deployment
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "*"
      spec:
        template:
          spec:
            containers:
            - name: inference-checkpoint
              env:
              - name: TENSOR_PARALLEL_SIZE
                value: "8"
    target:
      kind: Job
