# kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: rtx-pro-6000.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "*"
      spec:
        template:
          spec:
            containers:
            - name: inference-server
              env:
              - name: TENSOR_PARALLEL_SIZE
                value: "1"
    target:
      kind: Deployment
