apiVersion: apps/v1
kind: Deployment
metadata:
  name: '*'
spec:
  template:
    metadata:
      labels:
        ai.gke.io/model: gemma-7b-it
        ai.gke.io/inference-server: vllm
    spec:
      containers:
      - name: inference-server
        image: vllm/vllm-openai:v0.6.6
        args:
        - --model=$(MODEL_ID)
        - --device=cpu
        - --enforce-eager
        - --disable-async-output-proc
        - --worker-cls=vllm.worker.cpu_worker.CPUWorker
        env:
        - name: VLLM_DEVICE
          value: cpu
        - name: VLLM_TARGET_DEVICE
          value: cpu
        - name: MODEL_ID
          value: google/gemma-7b-it
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        resources:
          requests:
            cpu: "8"
            memory: "32Gi"
          limits:
            cpu: "16"
            memory: "64Gi"
        readinessProbe:
          failureThreshold: 120
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
