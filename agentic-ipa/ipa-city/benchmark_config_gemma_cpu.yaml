server:
  type: vllm
  base_url: http://localhost:8002
  model_name: google/gemma-7b-it
api:
  type: completion
  streaming: true
data:
  type: random
  input_distribution:
    min: 128
    max: 1024
    mean: 512
    type: uniform
  output_distribution:
    min: 16
    max: 256
    mean: 128
    type: uniform
load:
  type: constant
  stages:
  - rate: 0.5
    duration: 60
storage:
  local_storage:
    path: ./results_gemma_cpu
