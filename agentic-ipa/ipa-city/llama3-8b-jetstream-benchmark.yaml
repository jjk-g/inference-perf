api:
  type: completion
  streaming: true
data:
  type: random
  input_distribution:
    min: 128
    max: 512
    mean: 320.0
    type: uniform
  output_distribution:
    min: 16
    max: 128
    mean: 72.0
    type: uniform
load:
  type: constant
  stages:
  - rate: 2.0
    duration: 30
server:
  type: jetstream
  model_name: llama3-8b
  base_url: http://localhost:18012/api/v1/namespaces/default/services/llama3-8b-jetstream-service:8000/proxy
storage:
  local_storage:
    path: llama3-8b-jetstream-report
