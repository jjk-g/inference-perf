apiVersion: v1
kind: Service
metadata:
  labels:
    app: gemma-7b-it-vllm-inference-server
  name: gemma-7b-it-vllm-service-cpu
spec:
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: gemma-7b-it-vllm-inference-server
    deployment: gemma-7b-it-vllm-deployment
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: gemma-7b-it-vllm-inference-server
  name: gemma-7b-it-vllm-deployment-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gemma-7b-it-vllm-inference-server
      deployment: gemma-7b-it-vllm-deployment
  template:
    metadata:
      labels:
        ai.gke.io/inference-server: vllm
        ai.gke.io/model: gemma-7b-it
        app: gemma-7b-it-vllm-inference-server
        deployment: gemma-7b-it-vllm-deployment
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: g4-pool-1
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
      containers:
      - command: ["/bin/sh", "-c"]
        args:
        - |
          export VLLM_TARGET_DEVICE=cpu
          export VLLM_DEVICE=cpu
          python3 -m vllm.entrypoints.openai.api_server --model $(MODEL_ID) --device cpu --disable-async-output-proc --dtype half
        env:
        - name: MODEL_ID
          value: google/gemma-7b-it
        - name: VLLM_LOGGING_LEVEL
          value: DEBUG
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: hf_api_token
              name: hf-secret
        image: vllm/vllm-openai:v0.6.3
        name: inference-server
        ports:
        - containerPort: 8000
          name: metrics
        readinessProbe:
          failureThreshold: 120
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        resources:
          limits:
            cpu: "32"
            memory: 128Gi
          requests:
            cpu: "16"
            memory: 64Gi
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - emptyDir:
          medium: Memory
        name: dshm
